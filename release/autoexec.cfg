// ===================================================================
//  PreyVR PCVR - your settings
//
//  This file is read every time the game starts, AFTER the shipped
//  settings, so anything you set here wins. Nothing in it is active:
//  every line is commented out with //. Delete the // in front of a
//  line to turn it on.
//
//  The game ships at maximum quality. It is a 2006 game and a modern
//  card should not notice - but VR asks for ten times the pixels a
//  monitor does, so if you are on a weaker machine, start at the
//  bottom of this file.
//
//  Nothing here can break the game. If you make a mess of it, delete
//  the file and the shipped settings come back.
// ===================================================================


// --- IF THE FRAME RATE IS TOO LOW ----------------------------------
//
// In the order I would try them. Each one on its own line; turn on one
// at a time so you know which one bought you what.

// 1. Portals stop drawing their far side beyond the distance the map
//    intended. Costs the least to turn down, because a portal in view
//    is a whole extra render of the world beyond it.
//    0 = draw them at any range (shipped)   1 = as the map intended
// seta pcvr_portalDistance "1"

// 2. Bloom, narrower. The brightness stays the same either way - the
//    radius and the brightness are separate settings.
//    3 = 7x7 (shipped)   1 = 3x3   0 = one quad, nearly free
// seta pcvr_bloomRange "1"

// 3. Shadows. The single biggest thing left after those two.
// seta r_shadows "0"

// 4. Resolution. 1.0 is already what your headset runtime asked for,
//    so this is genuinely lowering it, and it will look softer.
//    0.9 is about 20% fewer pixels; 0.8 is about a third fewer.
// seta vr_supersampling "0.9"

// 5. Ambient lighting pass, then specular, then normal maps. These
//    change how the game looks quite a lot. Last resorts.
// seta r_skipNewAmbient "1"
// seta r_skipSpecular "1"
// seta r_skipBump "1"


// --- LOOK -----------------------------------------------------------

// Bloom brightness. 1 is what Prey and the Quest build look like, and
// it blows highlights out on a bright PC display; 0.2 is shipped.
// 0 turns bloom off entirely.
// seta pcvr_bloomScale "0.5"

// Texture filtering. 16 is shipped. Note that opening the in-game
// video options and applying a quality level resets this to 8, because
// that is what Prey's own 2006 "ultra" preset says.
// seta image_anisotropy "16"


// --- COMFORT AND CONTROLS -------------------------------------------

// Turning. 1 = smooth (shipped), 0 = snap.
// seta vr_turnmode "0"

// Smooth turn speed, degrees per second.
// seta pcvr_smoothTurnSpeed "130"

// Snap turn angle, degrees. Only used when vr_turnmode is 0.
// seta vr_turnangle "45"

// Screen shake, 0 to 1. Lower it if the shaking bothers you in VR.
// seta vr_shakeAmplitude "0.25"

// Which hand holds the weapon. 0 = right, 1 = left.
// seta vr_weaponHand "0"


// --- TIMING ---------------------------------------------------------

// One world update per displayed frame, locked to your headset's
// refresh. On by default. Without it the world runs on its own clock
// at 90.909 updates a second against a 90 Hz display, and 6-7% of
// frames advance the world twice or not at all.
//
// Turn it OFF if the game feels sluggish rather than smoother - it
// runs the world about 1.5% slow, which should be invisible.
// seta pcvr_frameLockedTics "0"


// --- STREAMING AND RECORDING ----------------------------------------

// A plain desktop window showing one eye, for OBS. Virtual Desktop's
// own preview works, but it is awkward to capture; this is a normal
// window you can crop.
//   0 = off (shipped)   1 = on
// seta pcvr_mirror "1"

// It opens borderless fullscreen, never exclusive. Exclusive fullscreen
// owns the display output and paces presents at the monitor's refresh,
// which is what held this game at 60 fps with the mirror on. There is
// nothing to win either: nobody is playing on the monitor.

// Which eye it shows. 0 = left, 1 = right (shipped). It is the same
// blit at the same cost either way - the only difference in the
// picture is the few centimetres between your eyes.
// seta pcvr_mirrorEye "0"

// Show it in a window instead of fullscreen. Off the menu because
// there is no performance reason to prefer one, but here if you are on
// a single monitor and want the mirror beside your desktop rather than
// over it. Drag and resize it like any window.
// seta pcvr_mirrorWindowed "1"

// How big it opens as a fraction of one eye buffer. Only matters with
// pcvr_mirrorWindowed above - fullscreen takes the monitor's size.
// seta pcvr_mirrorScale "0.5"

// How many times a second the mirror window is allowed to redraw.
//
// This one matters. A windowed present is absorbed by Windows at the
// DESKTOP's refresh, so drawing the mirror on every VR frame - 90 a
// second onto a 60 Hz monitor - fills the present queue and the VR
// frame ends up waiting for the monitor. That pins a 90 Hz headset to
// 60 with the mirror on, which is exactly the bug this setting fixes.
//
// 0 is shipped and means "follow your monitor".
//
// Be aware there is no smooth answer here, and it is not a fault in
// the port. The headset runs at 90 and a 60 Hz monitor cannot show
// 90 of anything:
//
//   60   keeps 2 frames in 3, so motion goes 1-1-2. Juddery, but it
//        is the most frames your screen can actually display.
//   90   every frame, but a 60 Hz panel samples them unevenly and
//        you get tearing instead.
//   30   the only EVEN option, because 30 divides both 90 and 60
//        exactly. Smoothest cadence, but it looks like 30 fps.
//
// Only matching the rates removes it - a 90/120 Hz monitor, or
// running the headset at 60. Try 30 if judder bothers you more than
// frame rate does.
// seta pcvr_mirrorHz "60"

// What to do when the mirror window is not the shape of one eye -
// which it never is once you maximise it. A headset eye is TALLER
// than it is wide (3072x3264 on a Quest 3); a monitor is wider. The
// window opens at the right shape, so this only matters if you resize
// it.
//   0 = stretch to fill the window (distorted, this is what 0.9.40 did)
//   1 = whole eye, correct shape, black bars down the sides
//   2 = crop the middle of the eye to fill the window (shipped)
// seta pcvr_mirrorFit "2"

// Where that crop sits vertically. 0 = top of the eye, 0.5 = middle
// (shipped), 1 = bottom. Raise it if you want more of the HUD and
// less ceiling in the shot.
// seta pcvr_mirrorCropY "0.5"



// --- STARTUP ---------------------------------------------------------

// How long the Game Or Die splash stays up before the main menu, in
// seconds. 0 goes straight to the menu.
// seta pcvr_splashSeconds "3"


// --- FLATSCREEN (PreyVR.exe -flat) ----------------------------------
//
// These do nothing in the headset. They are for "Play PreyVR
// flatscreen.bat", which runs the game on the monitor with no VR
// runtime at all.

// Gamepad look speed, degrees per second at full stick.
// seta pcvr_padLookSpeed "150"

// Gamepad stick deadzone, 0 to 1. Raise it if the view drifts with the
// sticks at rest.
// seta pcvr_padDeadzone "0.20"


// --- DIAGNOSTICS ----------------------------------------------------

// The console, for typing any of these in while the game is running
// instead of editing this file. The key is the one under Escape.
// seta com_allowConsole "1"

// Write the engine log. Already on; leave it on if you might report
// a problem, because it is the only record of what happened.
// seta logFile "2"
